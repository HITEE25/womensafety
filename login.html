<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Women Safety</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <style>
            .card {
                backdrop-filter: blur(10px);
                background: rgb(255, 255, 255);
                color: #040404;
                border: 1px solid rgba(255, 255, 255, .2);
            }
        </style>
    </head>

    <body class="d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-lg p-4">
                        <h3 class="text-center mb-4">Women
                            Safety Login</h3>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" id="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            <button class="btn btn-warning w-100 fw-bold" type="submit">Login</button>
                        </form>
                        <div class="text-center mt-3 small text-white-50">
                            Demo: user / 1234, admin / admin123
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            fetch("navbar.html")
                .then(res => res.text())
                .then(data => {
                    document.getElementById("navbar").innerHTML = data;
                });
            document.getElementById('loginForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value.trim();

                if ((u === 'user' && p === '1234') || (u === 'admin' && p === 'admin123')) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', u === 'admin' ? 'admin' : 'user');
                    if (u === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alert('Invalid login');
                }
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
