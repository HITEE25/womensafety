<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Complaint Registration</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="navbar"></div>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <h2 class="text-center mb-4"><i class="bi bi-chat-square-text-fill text-warning me-2"></i>Register
                        Complaint</h2>
                    <form id="complaintForm">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Incident Location</label>
                            <input type="text" class="form-control" id="incidentLocation" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold">Submit Complaint</button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            // Check login
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.replace('login.html');
            }

            // Load navbar first
            fetch("navbar.html")
                .then(res => res.text())
                .then(data => {

                    document.getElementById("navbar").innerHTML = data;

                    // Show admin link
                    const adminLink = document.getElementById('adminLink');

                    if (
                        localStorage.getItem('userRole') === 'admin'
                        && adminLink
                    ) {
                        adminLink.style.display = 'block';
                    }

                    // Logout button
                    const logoutBtn = document.getElementById('logoutBtn');

                    if (logoutBtn) {

                        logoutBtn.addEventListener('click', function (e) {

                            e.preventDefault();

                            localStorage.clear();

                            window.location.replace('login.html');
                        });
                    }
                });

            // Complaints
            let complaints =
                JSON.parse(localStorage.getItem('complaints')) || [];

            // Complaint Form
            document.getElementById('complaintForm')
                .addEventListener('submit', (e) => {

                    e.preventDefault();

                    const complaint = {

                        id: Date.now(),

                        name:
                            document.getElementById('name').value.trim(),

                        location:
                            document.getElementById('incidentLocation').value.trim(),

                        description:
                            document.getElementById('description').value.trim(),

                        status: 'Pending',

                        time:
                            new Date().toLocaleString('en-IN')
                    };

                    complaints.unshift(complaint);

                    localStorage.setItem(
                        'complaints',
                        JSON.stringify(complaints)
                    );

                    alert('Complaint submitted successfully.');

                    e.target.reset();
                });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
