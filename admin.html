<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Complaints</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <style>
            .card {
                background: rgba(255, 255, 255, 0);
                color: #040404;
            }
        </style>
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top p-3">
            <div class="container">
                <a class="navbar-brand fw-bold fs-3" href="index.html">
                    <i class="bi bi-shield-fill-check text-danger me-2"></i>
                    Women Safety
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                        </li>

                    </ul>
                </div>
            </div>
        </nav>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-11">

                    <h2 class="text-center mb-4"><i class="bi bi-shield-lock-fill text-warning me-2"></i>Admin
                        Complaints</h2>
                    <div id="complaintsBox"></div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Safe navbar insertion if using external navbar
                const navbarContainer = document.getElementById('navbar');
                if (navbarContainer) {
                    fetch('navbar.html')
                        .then(res => res.text())
                        .then(html => {
                            navbarContainer.innerHTML = html;
                            // bind logout after navbar is injected
                            const logoutBtn = document.getElementById('logoutBtn');
                            if (logoutBtn) {
                                logoutBtn.addEventListener('click', (e) => {
                                    e.preventDefault();
                                    localStorage.removeItem('isLoggedIn');
                                    localStorage.removeItem('userRole');
                                    // send user to login and block back
                                    window.location.replace('login.html');
                                });
                            }
                        })
                        .catch(err => {
                            console.warn('Could not load navbar.html:', err);
                        });
                } else {
                    // If navbar not external (your file already contains navbar), bind logout directly
                    const logoutBtnInline = document.getElementById('logoutBtn');
                    if (logoutBtnInline) {
                        logoutBtnInline.addEventListener('click', (e) => {
                            e.preventDefault();
                            localStorage.removeItem('isLoggedIn');
                            localStorage.removeItem('userRole');
                            window.location.replace('login.html');
                        });
                    }
                }

                // Protect page: require login + admin role
                if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('userRole') !== 'admin') {
                    window.location.replace('login.html');
                    return;
                }

                // Load complaints safely
                let complaints = [];
                try {
                    complaints = JSON.parse(localStorage.getItem('complaints')) || [];
                } catch (err) {
                    console.error('Failed parsing complaints from localStorage', err);
                    complaints = [];
                }

                // Save and update functions
                function saveComplaints() {
                    localStorage.setItem('complaints', JSON.stringify(complaints));
                    updateComplaintCount();
                }

                function updateComplaintCount() {
                    const pendingCount = complaints.filter(c => c.status !== 'Resolved').length;
                    // update any dashboard count if present
                    try {
                        const el = document.getElementById('complaintsCount');
                        if (el) el.textContent = pendingCount;
                    } catch (e) { /* ignore */ }
                    // also store pending count if other pages read it
                    localStorage.setItem('complaintsCount', pendingCount);
                }

                // mark resolved (exposed globally so inline onclick works)
                window.markResolved = function (id) {
                    complaints = complaints.map(c => c.id === id ? Object.assign({}, c, { status: 'Resolved' }) : c);
                    saveComplaints();
                    renderComplaints();
                };

                function renderComplaints() {
                    const box = document.getElementById('complaintsBox');
                    if (!box) return console.warn('complaintsBox element missing');

                    // show pending first; but render all with status badge
                    if (complaints.length === 0) {
                        box.innerHTML = '<p class="text-center text-black-50">No complaints found.</p>';
                        updateComplaintCount();
                        return;
                    }

                    // Render all complaints (pending on top)
                    const sorted = complaints.slice().sort((a, b) => (a.status === 'Resolved') - (b.status === 'Resolved') || (b.time || 0) - (a.time || 0));

                    box.innerHTML = sorted.map(c => `
<div class="card mb-3 p-3">
<div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
<div>
<h5 class="mb-1">${escapeHtml(c.name)}</h5>
<div><strong>Location:</strong> ${escapeHtml(c.location)}</div>
<div><strong>Time:</strong> ${escapeHtml(c.time)}</div>
<div><strong>Status:</strong> <span class="badge ${c.status === 'Resolved' ? 'bg-success' : 'bg-warning text-dark'}">${escapeHtml(c.status)}</span></div>
</div>
<div class="text-end">
<button class="btn btn-success btn-sm" ${c.status === 'Resolved' ? 'disabled' : ''} onclick="markResolved(${c.id})">Mark Resolved</button>
</div>
</div>
<hr class="border-dark">
<p class="mb-0">${escapeHtml(c.description)}</p>
</div>
`).join('');

                    updateComplaintCount();
                }

                // small helper to avoid XSS when injecting stored text
                function escapeHtml(str) {
                    if (str === null || str === undefined) return '';
                    return String(str)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#039;');
                }

                // initial render
                renderComplaints();

            }); // DOMContentLoaded
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>

</html>
